<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps_1 OS</title>
<meta name="description" content="DevOps_1 OS — sistem operasi mini di browser yang menghubungkan semua proyek kelompok DevOps_1 dalam satu platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= BOOT SCREEN ================= -->
<section id="bootScreen" class="screen boot-screen">
  <div class="boot-logo">
    <span class="boot-logo-mark">D1</span>
    <span class="boot-logo-text">DevOps_1<span> OS</span></span>
  </div>
  <div class="boot-bar"><div class="boot-bar-fill" id="bootBarFill"></div></div>
  <p class="boot-status" id="bootStatus">Memulai sistem&hellip;</p>
</section>

<!-- ================= LOGIN SCREEN ================= -->
<section id="loginScreen" class="screen login-screen hidden">
  <div class="login-time" id="loginTime">--:--</div>
  <div class="login-date" id="loginDate">&mdash;</div>
  <div class="login-card">
    <div class="login-avatar">
      <img src="logo.jpeg" alt="Logo DevOps_1" onerror="this.remove()">
    </div>
    <p class="login-name">Kelompok DevOps_1</p>
    <p class="login-role">Tugas Kelompok &mdash; Software Mini OS</p>
    <button class="login-btn" id="loginBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      Masuk
    </button>
  </div>
</section>

<!-- ================= SHUTDOWN SCREEN ================= -->
<section id="shutdownScreen" class="screen shutdown-screen hidden">
  <div class="shutdown-spinner"></div>
  <p>Mematikan DevOps_1 OS&hellip;</p>
</section>

<!-- ================= DESKTOP ================= -->
<section id="desktop" class="desktop hidden">
  <div class="desktop-icons" id="desktopIcons"></div>

  <div class="windows-layer" id="windowsLayer"></div>

  <div class="start-menu hidden" id="startMenu">
    <div class="start-menu-head">
      <div class="start-avatar">
        <img src="logo.jpeg" alt="Logo DevOps_1" onerror="this.remove()">
      </div>
      <div>
        <p class="start-name">Kelompok DevOps_1</p>
        <p class="start-role">Tim DevOps_1</p>
      </div>
    </div>
    <div class="start-menu-list" id="startMenuList"></div>
    <button class="start-shutdown" id="shutdownBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10M18.4 6.6a9 9 0 11-12.8 0"/></svg>
      Matikan DevOps_1 OS
    </button>
  </div>

  <footer class="taskbar">
    <button class="taskbar-start" id="startBtn">
      <span class="start-mark">A</span> Start
    </button>
    <div class="taskbar-running" id="taskbarRunning"></div>
    <div class="taskbar-tray">
      <span class="tray-icon" title="Wi-Fi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a16 16 0 0120 0M5 12a11 11 0 0114 0M8.5 15.5a6 6 0 017 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="tray-icon" title="Baterai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4" stroke-width="2"/><rect x="4" y="9" width="12" height="6" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="tray-clock" id="trayClock">--:--</span>
    </div>
  </footer>
</section>

<script src="script.js"></script>
</body>
</html>
